
name: EcoPass Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Show versions
        run: |
          java -version
          sbt --version

      - name: Test and package EcoPass
        run: sbt clean test package

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecopass-jar
          path: target/scala-2.12/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/scala-2.12/*.jar
